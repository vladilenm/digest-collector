<!doctype html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <title>%%subject%%</title>
  <!-- Web fonts are progressive enhancement. Gmail uses the system fallbacks. -->
  <!--[if !mso]><!-->
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Spectral:wght@400;500&amp;display=swap" rel="stylesheet">
  <!--<![endif]-->
  <style>
    :root { color-scheme: light dark; supported-color-schemes: light dark; }
    body, table, td, p, a { -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
    table, td { mso-table-lspace:0pt; mso-table-rspace:0pt; }
    table { border-spacing:0; }
    img { border:0; outline:none; text-decoration:none; -ms-interpolation-mode:bicubic; }
    a[x-apple-data-detectors] { color:inherit!important; text-decoration:none!important; }
    @media screen and (max-width:600px) {
      .outer-pad { padding:16px 8px!important; }
      .content-pad { padding-left:24px!important; padding-right:24px!important; }
      .header-pad { padding-top:24px!important; padding-bottom:24px!important; }
      .hero-pad { padding-top:32px!important; }
      .headline { font-size:34px!important; line-height:39px!important; letter-spacing:-0.5px!important; }
      .brand-name { font-size:19px!important; }
      .footer-pad { padding:24px!important; }
    }
    @media (prefers-color-scheme:dark) {
      .email-bg { background-color:#0E0B14!important; }
      .email-surface { background-color:#17131F!important; }
      .ink { color:#F5F3FA!important; }
      .muted { color:#B6AFC4!important; }
      .subtle { color:#B6AFC4!important; }
      .rule { border-color:#2B2537!important; }
      .ink a { color:#C6B3FF!important; }
    }
  </style>
  <!--[if mso]><style>body,table,td,p,a {font-family:Arial,sans-serif!important;} h1,h2 {font-family:Georgia,serif!important;}</style><![endif]-->
</head>
<body class="email-bg" style="margin:0;padding:0;width:100%;background-color:#F7F6FA;color:#16121E;">
  <div style="display:none;font-size:1px;line-height:1px;color:#F7F6FA;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">Главное об ИИ за три дня: %%range%%.</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="email-bg" style="width:100%;background-color:#F7F6FA;">
    <tr><td class="outer-pad" align="center" style="padding:40px 16px;">
      <!--[if mso]><table role="presentation" width="640" align="center" cellpadding="0" cellspacing="0"><tr><td><![endif]-->
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="width:100%;max-width:640px;">
        <tr><td>
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="email-surface" style="width:100%;background-color:#FFFFFF;">
            <!-- SHARED: brand header. Keep logo on its original light background. -->
            <tr><td class="content-pad header-pad" style="padding:32px 48px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td width="44" style="width:44px;vertical-align:middle;">
                    <a href="https://irreplaceable-ai.ru/" style="text-decoration:none;">
                      <img src="https://irreplaceable-ai.ru/club/logo-light.png" width="40" height="40" alt="" style="display:block;width:40px;height:40px;background-color:#FFFFFF;border-radius:6px;">
                    </a>
                  </td>
                  <td style="padding-left:12px;vertical-align:middle;">
                    <a class="ink brand-name" href="https://irreplaceable-ai.ru/" style="font-family:'Golos Text','Segoe UI',Arial,sans-serif;font-size:21px;line-height:28px;font-weight:600;color:#16121E;text-decoration:none;">Незаменимые</a>
                  </td>
                </tr>
              </table>
            </td></tr>
            <tr><td class="content-pad" style="padding:0 48px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td class="rule" style="border-top:1px solid #E2DFEA;font-size:0;line-height:0;">&nbsp;</td></tr></table></td></tr>
            <tr><td class="content-pad hero-pad" style="padding:40px 48px 24px;">
              <p class="subtle" style="margin:0 0 20px;font-family:'IBM Plex Mono',Consolas,'Courier New',monospace;font-size:12px;line-height:18px;font-weight:500;letter-spacing:0.8px;color:#6B6578;">ДАЙДЖЕСТ / %%range%%</p>
              <h1 class="headline ink" style="margin:0;font-family:Spectral,Georgia,'Times New Roman',serif;font-size:44px;line-height:49px;font-weight:400;letter-spacing:-0.7px;color:#16121E;">Главное об ИИ</h1>
            </td></tr>
            <tr><td class="content-pad" style="padding:0 48px 24px;">
              <p class="ink" style="margin:0;font-family:'Golos Text','Segoe UI',Arial,sans-serif;font-size:18px;line-height:28px;color:#16121E;">Привет! Собрал главное об ИИ за три дня.</p>
            </td></tr>
            %%content%%
            <!-- SHARED: signature. -->
            <tr><td class="content-pad" style="padding:0 48px 40px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td class="rule" style="padding-top:24px;border-top:1px solid #E2DFEA;">
                <p class="ink" style="margin:0 0 4px;font-family:Spectral,Georgia,'Times New Roman',serif;font-size:26px;line-height:34px;color:#16121E;">Владилен</p>
                <p class="subtle" style="margin:0;font-family:'Golos Text','Segoe UI',Arial,sans-serif;font-size:14px;line-height:22px;color:#6B6578;">Клуб «Незаменимые»</p>
              </td></tr></table>
            </td></tr>
          </table>
        </td></tr>
        <!-- SHARED: Unisender resolves this unsubscribe tag separately for every recipient. -->
        <tr><td class="footer-pad" style="padding:24px 48px 0;">
          <p class="subtle" style="margin:0 0 12px;font-family:'Golos Text','Segoe UI',Arial,sans-serif;font-size:12px;line-height:19px;color:#6B6578;">Ты получил это письмо, потому что подписался на письма «Незаменимых».</p>
          <p style="margin:0;font-family:'Golos Text','Segoe UI',Arial,sans-serif;font-size:12px;line-height:22px;">
            <a class="muted" href="https://irreplaceable-ai.ru/" style="color:#565062;text-decoration:underline;">Сайт клуба</a>
            <span class="subtle" style="padding:0 8px;color:#6B6578;">·</span>
            <a class="muted" href="{{UnsubscribeUrl}}" style="color:#565062;text-decoration:underline;">Отписаться</a>
          </p>
        </td></tr>
      </table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td></tr>
  </table>
</body>
</html>
